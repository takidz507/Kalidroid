name: KaliDroid Android build

concurrency:
  group: kalidroid-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KaliDroid
        uses: actions/checkout@v4

      # Pin the exact upstream revision so the native execution engine is reproducible.
      - name: Checkout Android-patched PRoot engine
        uses: actions/checkout@v4
        with:
          repository: oonid/pr
          ref: a5a2a72b7f84eba9d9a2a795f6f11e725b181ab9
          path: upstream-pr

      - name: Import ARM64 native runtime
        run: ./scripts/import-proot-engine.sh "$GITHUB_WORKSPACE/upstream-pr"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify ARM64 native binaries
        run: |
          file app/src/main/jniLibs/arm64-v8a/libproot.so
          file app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          sha256sum -c app/src/main/jniLibs/arm64-v8a/SHA256SUMS.upstream

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: kalidroid-arm64-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/jniLibs/arm64-v8a/SHA256SUMS.upstream
            docs/THIRD_PARTY_PROOT_LICENSE
          if-no-files-found: error
          retention-days: 14
